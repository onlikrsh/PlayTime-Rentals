<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>PlayTime Admin</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <!-- Installable app: Safari → Share → Add to Home Screen -->
    <link rel="manifest" href="/admin.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PT Admin" />
    <meta name="theme-color" content="#0a1128" />
    <script>
      // Apply the saved theme before first paint so it doesn't flash.
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
      // Like a native app: no pinch-zoom (iPhone ignores user-scalable=no on its own)
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin/main.jsx"></script>
  </body>
</html>
